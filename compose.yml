name: todoapp
services:
  db:
    container_name: db
    image: postgres
    restart: always
    ports:
      - 5432:5432
    volumes:
      - dbdata:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: test123
      POSTGRES_USER: postgres
      POSTGRES_DB: tododb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  client:
    container_name: client
    build:
      context: ./frontend
    ports: 
      - 8080:80
    depends_on:
      - server
    env_file:
      - ./frontend/.env
  server:
    container_name: server
    build:
      context: ./backend
    ports:
      - 5001:5001
    env_file:
      - ./backend/.env
    depends_on:
      - db

volumes:
  dbdata: {}
